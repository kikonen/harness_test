# Harness configuration (YAML).
#
# Precedence for every setting: CLI flag > this file > server default.
# Every key is optional. Sampling / generation values are owned by the
# config: a missing key is NOT sent to the API, so the server's own
# default applies (issue #215).

# One or more named model profiles. `url` is the API base - the harness
# appends its path to it AS-IS (no rewriting):
#   api: openai -> .../v1      e.g. http://localhost:11434/v1  (/chat/completions)
#   api: ollama  -> server root, e.g. http://localhost:11434   (/api/chat)
models:
  - name: local            # selection key (used by -m / default_model)
    url: http://localhost:11434/v1
    api: openai            # endpoint type: openai (default) | ollama (issue #197)
    model: qwen2.5-coder:32b
    # token: sk-...        # optional bearer token
    num_ctx: 65536         # context window size (tokens)
    reasoning_effort: medium
    temperature: 0.6
    top_p: 0.95
    top_k: 20              # sampling top-k (integer)
    min_p: 0               # minimum probability threshold
    presence_penalty: 1.0  # penalty for already-present tokens
    repeat_penalty: 1.05   # penalty for repeated tokens
    # max_tokens: -1       # max completion tokens (openai endpoint); omit = server default
    # num_predict: -1      # same, native ollama endpoint; omit = server default
    # streaming: true      # per-profile override of the global 'streaming'
    #                      # key below: true streams THIS profile, false opts
    #                      # this profile out of a global true (a server or a
    #                      # proxy that mishandles a streamed response).
    #                      # Absent = the global key decides.

# Model used when -m is not given on the command line.
default_model: local

# Session compaction (/compact).
compact:
  recent_messages: 6       # messages retained verbatim after /compact
  auto_threshold: 88       # auto-compact when context usage reaches this % of the window
  max_size: 500            # max length (words) of the compaction summary
  reserved_tokens: 8192    # absolute headroom (tokens) kept free before auto-compact (issue #151)

# Auto-save the session at every prompt boundary (crash-proof, issue #107).
auto_save: true

# Max tool-loop iterations for a single turn before the loop is aborted
# (issue #226). Built-in default: 200.
# max_tool_iterations: 200

# Rendered-output palette (issue #303): colors the lines the output renderer
# prints (step labels, plan/say lines, warn/error, stats). Available:
# 'default' (colored), 'basic16' (16-color band only - no 256/truecolor),
# 'none' (plain, what --no-color selects). Omit the key for 'default'.
# The flag -p/--palette NAME overrides it. Terminal notes: the bright 90-97
# band, background colors and bold are all unreadable on a light background,
# so recessive lines use a real dark gray (38;5;240) - see
# doc/output_rendering_design.md.
# Switch it mid-session with /palette <name>; that choice is saved with the
# session and a resumed session keeps it.
# output_palette: default

# Streamed LLM responses (issue #28): consume each response chunk by chunk and
# show each part of the answer as it arrives (the spinner line carries the
# newest text of the answer instead of only the context estimate). Opt-in:
# default false, so a server that mishandles a streamed response needs no
# config at all. During a session it is toggled live with /stream and saved
# with the session.
# What streaming does NOT change: the normalized response the tool loop
# receives is identical either way - tool calls, usage stats and the session
# chain are the same. What it DOES cost: a streamed request is retried only
# until the first part arrives; after that a lost stream fails the turn
# instead of re-sending an answer the user already saw. The advisory calls
# (the command safety check, the /compact summary) stay buffered.
# streaming: false

# Markdown rendering of the assistant's answer (issue #106): render the model's
# answer with ANSI styling - headings, bold/italic, inline code and tables -
# instead of dumping raw markdown. Opt-in: default false, so the answer stays
# verbatim unless asked. The colors are seeded from the output palette, so a
# 'none' palette (--no-color) renders plain text with no ANSI.
# markdown: false

# Column basis for markdown tables (issue #106): a rendered table is sized to fit
# this many columns (clamped to the terminal width, so it never overflows). Omit
# the key and the basis is 80% of the detected terminal width - on a 160-column
# terminal that is ~128, so a table can use the extra width instead of the old
# fixed 80. The boundary rules (the "---- model ----" line) stay a fixed 80
# whatever this says. The flag --markdown-width N overrides it.
# markdown_max_width: 120

# External MCP servers whose tools the model may call (issue #48). Opt-in: omit
# the key (or leave it empty) and no MCP code runs at all - the mcp gem is not
# even loaded. Each entry is a stdio server the harness spawns and handshakes
# with at startup; its tools are exposed as "<name>.<tool>". A server that fails
# to start is reported in the startup banner and the run continues without it.
# name (the tool namespace) and command (the program to spawn) are required;
# args and env are optional.
# mcp_servers:
#   - name: filesystem
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]
#     env: { KEY: value }

# Automatic retries for transient network errors.
retry:
  count: 3                 # total attempts (1 initial + N-1 retries)
  delay: 2                 # base delay in seconds (exponential backoff)

# Enter on an EMPTY last line submits the multiline buffer (issue #198,
# for setups where no submit key reaches the terminal - e.g. remote via
# Windows Terminal). Pasted blank lines never trigger it. Default: false.
# double_enter_submit: true

# Full system prompt override: a FILE containing the prompt text (issue #223).
# Do NOT embed the prompt in this YAML - point at a file instead.
# --system-file still takes precedence over this key.
# system_prompt_file: prompts/my_system.txt

# Before the consent dialog for an UNAPPROVED shell command, ask the model
# itself (one cache-warm forked call per command batch) whether it looks
# safe; the verdict is shown as a NOTE in the dialog. Advisory only: it
# never auto-approves, never widens the allowlist, never bypasses "Allow".
# command_safety_check: true

# With command_safety_check on, the command consent posture as ONE enum key
# (issue #389 folded the two relaxations into it). An unrecognised value is a
# config error. A legacy true/false still works: true = safe, false/absent =
# manual. Default manual.
#   manual        every unapproved command asks.
#   safe          a "safe:" model verdict skips the dialog ("dangerous:" and a
#                 missing verdict still ask). Toggled LIVE with Ctrl+A (note
#                 editor or idle prompt); the spinner always shows the current
#                 mode as a [MODE] badge at the end of its line (issue #224
#                 follow-up).
#   denylist      FLOOR RELAXATION (issue #389): the disaster denylist normally
#                 refuses auto-approval in every posture, so a disaster word that
#                 sits INERT inside a quoted string (e.g. "mkfs.ext4" inside a
#                 quoted array literal) still costs a one-off Allow dialog. With
#                 this mode a real "safe:" verdict may auto-approve such a match -
#                 on the model-driven run.command path only, never the ! bang
#                 path. CONFIG-ONLY: no live toggle, not saved with the session,
#                 not a Ctrl+A posture. A "dangerous:" or missing verdict keeps
#                 the command fully denylisted, and every override is status-lined
#                 AND written to harness.log naming the verdict that allowed it.
#   safe_denylist both halves.
# command_safety_auto_approve: manual
# command_safety_denylist_safe_approve: false  # the denylist half on its own, if
#                                               # you prefer two boolean keys (ORed
#                                               # into the enum above)

# Shell consent postures (issue #221, the consent-fatigue fix). Three
# levels: MANUAL (every unapproved command asks) < AUTO-APPROVE (model-
# "safe:" commands skip the dialog) < YOLO (EVERY run.command call runs
# with no dialog and no model safety check at all). YOLO is the INITIAL
# posture only - during a session it is toggled live with /yolo and is
# saved with the session (resume keeps it). Opt-in: default false.
# YOLO covers FILE access too (issue #274): read, write and delete inside the
# working directory run without a dialog - a coverage the posture reads live, never
# a stored grant. What it does NOT change: the disaster denylist - a well-known
# disaster (rm -rf, format C:, sudo, git push -f, curl | sh, ...) keeps the dialog
# in EVERY posture - and file coverage never reaches a sensitive path, the owner's
# own space (local/), or a path outside the working directory. web.fetch hosts are
# a separate axis (issue #33). Every auto-approval is status-lined and logged.
# (The floor's only exception is the denylist mode of command_safety_auto_approve
# above - not part of any posture.)
# yolo: false

# Workdir-relative dirs the YOLO posture never auto-covers (issue #385). The
# posture covers read/write/delete across the working directory without asking,
# but these dirs keep their consent dialog in every posture - a human grant can
# still cover them, only the auto-approval is blocked. Omit the key and the
# default is the owner's space (local/). An explicit list replaces the default;
# an explicit empty list protects nothing.
# protected_dirs:
#   - local
#   - secrets

# The `! cmd` bang syntax keeps its confirmation dialog (default true).
# Set false and a user-typed bang command runs immediately - the human's
# own typing is already the consent. The disaster denylist still applies.
# bang_requires_confirmation: true

# web.fetch private addresses (issue #33). web.fetch refuses a host that resolves
# to loopback, RFC1918, CGNAT, IPv6 unique-local, link-local or multicast: that is
# the shape of an SSRF (a fetched page pointing the harness at localhost or at the
# cloud metadata endpoint 169.254.169.254). Set true to allow a LOCAL or internal
# endpoint (a dev server on 127.0.0.1, an intranet wiki). It lifts the private
# ranges ONLY - link-local and multicast stay refused, and a host grant never
# substitutes for this key. Opt-in: default false.
# web_fetch_allow_private: false

# External editor for the buffer you are typing (issue #298). Press Ctrl+G at
# the prompt (or inside a mid-turn note) and the text you have typed is written
# to a scratch file, opened with this command, and comes back as the DRAFT - the
# submit key is still what sends it. The command is split into argv words and run
# directly (never through a shell), so flags are fine and shell metacharacters
# are literal. Absent = Ctrl+G does what Reline always did with it.
# Resolution order: --editor <command line> > $HARNESS_EDITOR > this key >
# $EDITOR > $VISUAL.
# editor: nvim -R      # or: code -w, notepad, nano, vim, ...
