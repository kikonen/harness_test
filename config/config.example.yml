# Harness configuration (YAML).
#
# Precedence for every setting: CLI flag > this file > server default.
# Every key is optional. Sampling / generation values are owned by the
# config: a missing key is NOT sent to the API, so the server's own
# default applies (issue #215).

# One or more named model profiles. `url` is the API base - the harness
# appends its path to it AS-IS (no rewriting):
#   api: openai -> .../v1      e.g. http://localhost:11434/v1  (/chat/completions)
#   api: ollama  -> server root, e.g. http://localhost:11434   (/api/chat)
models:
  - name: local            # selection key (used by -m / default_model)
    url: http://localhost:11434/v1
    api: openai            # endpoint type: openai (default) | ollama (issue #197)
    model: qwen2.5-coder:32b
    # token: sk-...        # optional bearer token
    num_ctx: 65536         # context window size (tokens)
    reasoning_effort: medium
    temperature: 0.6
    top_p: 0.95
    top_k: 20              # sampling top-k (integer)
    min_p: 0               # minimum probability threshold
    presence_penalty: 1.0  # penalty for already-present tokens
    repeat_penalty: 1.05   # penalty for repeated tokens
    # max_tokens: -1       # max completion tokens (openai endpoint); omit = server default
    # num_predict: -1      # same, native ollama endpoint; omit = server default

# Model used when -m is not given on the command line.
default_model: local

# Session compaction (/compact).
compact:
  recent_messages: 6       # messages retained verbatim after /compact
  auto_threshold: 88       # auto-compact when context usage reaches this % of the window
  max_size: 500            # max length (words) of the compaction summary
  reserved_tokens: 8192    # absolute headroom (tokens) kept free before auto-compact (issue #151)

# Auto-save the session at every prompt boundary (crash-proof, issue #107).
auto_save: true

# Max tool-loop iterations for a single turn before the loop is aborted
# (issue #226). Built-in default: 200.
# max_tool_iterations: 200

# Automatic retries for transient network errors.
retry:
  count: 3                 # total attempts (1 initial + N-1 retries)
  delay: 2                 # base delay in seconds (exponential backoff)

# Enter on an EMPTY last line submits the multiline buffer (issue #198,
# for setups where no submit key reaches the terminal - e.g. remote via
# Windows Terminal). Pasted blank lines never trigger it. Default: false.
# double_enter_submit: true

# Full system prompt override: a FILE containing the prompt text (issue #223).
# Do NOT embed the prompt in this YAML - point at a file instead.
# --system-file still takes precedence over this key.
# system_prompt_file: prompts/my_system.txt

# Before the consent dialog for an UNAPPROVED shell command, ask the model
# itself (one cache-warm forked call per command batch) whether it looks
# safe; the verdict is shown as a NOTE in the dialog. Advisory only: it
# never auto-approves, never widens the allowlist, never bypasses "Allow".
# command_safety_check: true

# With command_safety_check on, the INITIAL command consent posture: when
# true, commands the model verdicts "safe:" skip the consent dialog
# ("dangerous:" verdicts and missing verdicts still ask). Manual consent
# (false) is the default. During a session the posture is toggled live
# with Ctrl+A (note editor or idle prompt); the spinner always shows the
# current mode as a [cmd: ...] badge (issue #224 follow-up).
# command_safety_auto_approve: false

# Shell consent postures (issue #221, the consent-fatigue fix). Three
# levels: MANUAL (every unapproved command asks) < AUTO-APPROVE (model-
# "safe:" commands skip the dialog) < YOLO (EVERY run.command call runs
# with no dialog and no model safety check at all). YOLO is the INITIAL
# posture only - during a session it is toggled live with /yolo and is
# saved with the session (resume keeps it). Opt-in: default false.
# What YOLO does NOT change: the disaster denylist - a well-known disaster
# (rm -rf, format C:, sudo, git push -f, curl | sh, ...) keeps the dialog
# in EVERY posture, file-access grants are untouched, and every auto-
# approved run is status-lined and written to harness.log.
# yolo: false

# The `! cmd` bang syntax keeps its confirmation dialog (default true).
# Set false and a user-typed bang command runs immediately - the human's
# own typing is already the consent. The disaster denylist still applies.
# bang_requires_confirmation: true
