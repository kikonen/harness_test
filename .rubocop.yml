# House rules for the harness (issue #302).
#
# Only the mechanical part of what harness.md states is enforced:
# DisabledByDefault, then Layout / Lint / Naming as departments and a handful of
# Style cops. Why each choice was made and what was measured: doc/rubocop_style.md.
#
# Existing violations are baselined in .rubocop_todo.yml, so new code is held to
# the rules while old code is cleaned step by step, in its own commit.

inherit_from: .rubocop_todo.yml

# Without this an Exclude set here (the spec/**/* scoping below) REPLACES the
# Exclude lists the todo file generates for the same cop, silently discarding
# the baseline.
inherit_mode:
  merge:
    - Exclude

AllCops:
  DisabledByDefault: true
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # Racc output; its own header says DO NOT MODIFY.
    - lib/shell_parser.rb
    - tmp/**/*
    - .harness/**/*
    - vendor/**/*

# Formatting rules in test code buy nothing. Lint and Naming stay on everywhere:
# they catch mistakes, not taste.
Lint:
  Enabled: true

Lint/NonLocalExitFromIterator:
  Enabled: false

Layout:
  Enabled: true
  Exclude:
    - spec/**/*

# Class and method size is review judgement, not a house rule.
Metrics:
  Enabled: false

Naming:
  Enabled: true

Naming/PredicatePrefix:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - id
    - io
    - ui

# --- Continuation shape -----------------------------------------------------
# A multi-line call puts the first argument on its own line, every argument on
# its own line, one indentation step from the line that opened it, and closes
# the brackets on the last element's line ('})'). Measured against the style
# probe the owner wrote (doc/rubocop_style.md): these settings accept the
# hand-written shape and flag the model-written one.
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

# Keys of a multi-line hash line up; VALUES get no table padding.
Layout/HashAlignment:
  EnforcedColonStyle: key

# '}' of a multi-line hash on the line after its last key.
Layout/MultilineHashBraceLayout:
  EnforcedStyle: symmetrical

Layout/MultilineMethodCallBraceLayout:
  EnforcedStyle: same_line

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstHashElementLineBreak:
  Enabled: true

Layout/FirstArrayElementLineBreak:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

# Continuation of a "\-joined string gets one step from the assignment, not
# aligned under the opening quote.
Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented

# --- Separators -------------------------------------------------------------
# Blank lines between semantic blocks: the guard clause is the case a wall of
# text starts with (a guard glued to what follows it reads as trailing noise).
Layout/EmptyLineAfterGuardClause:
  Enabled: true

Layout/EmptyLineBetweenDefs:
  Enabled: true

# No padding blank lines just inside a body. ClassBody / BlockBody / ModuleBody
# have the style option; MethodBody does NOT (it is a plain on/off cop and
# rejects EnforcedStyle with a warning on every run), so it is only enabled.
Layout/EmptyLinesAroundClassBody:
  Enabled: true
  EnforcedStyle: no_empty_lines

Layout/EmptyLinesAroundMethodBody:
  Enabled: true

Layout/EmptyLinesAroundBlockBody:
  Enabled: true
  EnforcedStyle: no_empty_lines

Layout/SpaceInsideBlockBraces:
  # The repo writes an empty block as { } (Task.new { }).
  EnforcedStyleForEmptyBraces: space

Layout/ExtraSpacing:
  AllowForAlignment: true

# 0 offenses today (measured over lib/, harness.rb and spec/), but the layout
# corrector itself leaves trailing spaces when it breaks an argument list - this
# is what keeps a -a run from quietly dirtying the tree.
Layout/TrailingWhitespace:
  Enabled: true

Layout/EndOfLine:
  # native fires on all 131 files on a Windows checkout (native means CRLF
  # there); the tree is LF (.gitattributes eol=lf, core.autocrlf false).
  EnforcedStyle: lf

# Constants belong at the top of the class, not scattered between its methods.
# The default ExpectedOrder also demands a public_class_methods / initializer
# arrangement this repo does not follow, so the order is trimmed to what the
# rule is actually about. Its autocorrect is UNSAFE (a constant read by an
# earlier method would change meaning), so reordering is reviewed by eye.
Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - initializer
    - public_methods
    - private_methods

Layout/LineLength:
  # 90 is the width of ONE Emacs buffer in the two-pane setup the code is read
  # in (Zenbook: two side-by-side windows fit ~90 columns each) - a physical
  # constraint, not an abstract limit. A line over 90 is acceptable where
  # splitting it would be uglier; the long ones stay baselined.
  Max: 90
  AllowedPatterns:
    - '^\s*(# |url: |https?://)'

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes
  Exclude:
    - spec/**/*

# 1.9-style keys are already the repo's practice (measured: 821 offenses against
# 'hash_rockets'), so the live part of this cop is the VALUE omission: when the
# value is the variable the key is named after, write { tools: } not
# { tools: tools }. Measured: 48 such calls in lib/ + harness.rb (127 more in
# specs, which this cop skips).
Style/HashSyntax:
  Enabled: true
  EnforcedStyle: ruby19
  EnforcedShorthandSyntax: always
  Exclude:
    - spec/**/*

# A call that takes arguments wears them; a call with none never does. super
# stays bare unless suppressing the forwarding is the point.
Style/MethodCallWithArgsParentheses:
  Enabled: true
  EnforcedStyle: require_parentheses
  AllowedMethods:
    - emit_line
    - exit
    - print
    - p
    - puts
    - raise
    - sleep
    - warn
    - yield
  Exclude:
    - spec/**/*

Style/MethodCallWithoutArgsParentheses:
  Enabled: true
  Exclude:
    - spec/**/*

Style/SuperArguments:
  Enabled: true
  Exclude:
    - spec/**/*

Style/SuperWithArgsParentheses:
  Enabled: true
  Exclude:
    - spec/**/*
