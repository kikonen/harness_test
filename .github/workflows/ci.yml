name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Keep in sync with .ruby-version (setup-ruby does not resolve file:// here)
          ruby-version: ruby-4.0.0
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
