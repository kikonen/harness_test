name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # ubuntu-latest (ubuntu-26.04) only builds the latest patch of a series,
          # so a fixed old pin (4.0.1) 404s here; deliberately not tied to .ruby-version.
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Run rubocop
        run: bundle exec rubocop --format github
